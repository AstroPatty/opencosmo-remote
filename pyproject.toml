[project]
name = "opencosmo-remote"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Wells", email = "patrick.wells.95@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "appdirs>=1.4.4",
    "click>=8.3.0",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "opencosmo>=0.9.6",
    "protobuf>=6.33.0",
]

[project.scripts]
opencosmo-remote = "opencosmo_remote.register:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
